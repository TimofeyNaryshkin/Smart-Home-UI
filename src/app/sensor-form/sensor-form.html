<form [formGroup]="sensorForm" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>Label</mat-label>
    <input matInput type="text" formControlName="label" />
  </mat-form-field>
  <mat-form-field class="dashboard-full-width">
    <mat-label>Icon</mat-label>
    <input matInput type="text" formControlName="icon" />
  </mat-form-field>
  <mat-form-field class="dashboard-full-width">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount" />
  </mat-form-field>
  <mat-form-field class="dashboard-full-width">
    <mat-label>Unit</mat-label>
    <input matInput type="text" formControlName="unit" />
  </mat-form-field>
  <button matButton type="submit">Add</button>
</form>
