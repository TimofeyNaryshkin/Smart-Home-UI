<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  @for (t of tabs(); track t.id) {
    <a
      mat-tab-link
      [routerLink]="[t.id]"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      {{ t.title }}
    </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel>
  <router-outlet />
</mat-tab-nav-panel>
