<mat-card [appHighlight]="hasActiveDevice()">
  <mat-card-header>
    <mat-card-title>{{ data().title }}</mat-card-title>
    @if (isDeviceGroup()) {
      <mat-slide-toggle
        [checked]="isGroupActive()"
        (change)="toggleIsGroupActive()"
        [aria-label]="data().title"
      ></mat-slide-toggle>
    }
  </mat-card-header>
  <mat-card-content [className]="data().layout">
    @for (i of data().items; track $index) {
      @if (i.type === 'device') {
        <app-device
          [data]="i"
          (dataChange)="updateDevice($index, $event)"
          [isSingle]="data().layout === 'singleDevice'"
        />
      } @else {
        <app-sensor [data]="i" />
      }
    }
  </mat-card-content>
  @if (editModeService.isEditMode()) {
    <mat-card-actions>
      <button matButton>EDIT</button>
      <div class="card-edit-controls">
        <button matIconButton [disabled]="details().order === 1">
          <mat-icon fontIcon="remove" />
        </button>
        <span>{{ details().order }}</span>
        <button matIconButton [disabled]="isAddButtonDisabled()">
          <mat-icon fontIcon="add" />
        </button>
        <button matIconButton><mat-icon fontIcon="more_vert" /></button>
      </div>
    </mat-card-actions>
  }
</mat-card>
