<h2 mat-dialog-title>Add Card</h2>
<mat-dialog-content>
  @for (card of cards; track card.id) {
    <app-card
      [isExamaple]="true"
      [details]="{ order: $index + 1, length: cards.length }"
      [class]="card.layout === 'horizontalLayout' ? '' : 'example-card'"
      [mat-dialog-close]="card.layout"
      [data]="card"
    />
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">Cancel</button>
</mat-dialog-actions>
