<mat-dialog-content>
  <mat-form-field>
    <mat-label>{{ data.message }}</mat-label>
    <input matInput type="text" [formControl]="title" />
    @if (title.hasError('notUnique')) {
      <mat-error>Tab with such title already exists</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">Cancel</button>
  <button matButton [disabled]="title.invalid"  [mat-dialog-close]="title.value">Confirm</button>
</mat-dialog-actions>
